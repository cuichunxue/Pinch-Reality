<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16131F">
<title>ゆびまど</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16131F;
    --paper:#FFFFFF;
    --tone:#CFCBDD;
    --sakura:#FF6FA3;
    --rec:#FF3B4E;
    --glass:rgba(22,19,31,.42);
    --ui-font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    --title-font:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--ui-font);
    overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;z-index:-1}

  /* ---------- start screen ---------- */
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 1px 1px, rgba(207,203,221,.16) 1.2px, transparent 1.6px) 0 0/9px 9px,
      var(--ink);
    transition:opacity .45s ease, visibility .45s}
  #intro.hidden{opacity:0;visibility:hidden}
  .window{position:relative;width:min(78vw,340px);aspect-ratio:1.55;transform:rotate(-3deg)}
  .sheet{position:absolute;inset:0;background:var(--paper);color:var(--ink);border-radius:3px;
    box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;overflow:hidden;
    clip-path:polygon(2% 4%,98% 0,100% 96%,0 100%);animation:open 1.1s cubic-bezier(.2,1.4,.4,1) .15s both}
  .sheet::before{content:"";position:absolute;inset:0;
    background:radial-gradient(circle, rgba(22,19,31,.13) 1.3px, transparent 1.7px) 0 0/7px 7px;
    -webkit-mask:linear-gradient(135deg,transparent 35%,#000 100%);mask:linear-gradient(135deg,transparent 35%,#000 100%)}
  .sheet h1{position:relative;margin:0;font-family:var(--title-font);font-weight:400;font-size:clamp(40px,13vw,62px);
    letter-spacing:.02em;line-height:1}
  @keyframes open{from{clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%)}}
  .corner{position:absolute;width:44px;height:44px;border:5px solid var(--sakura);border-radius:4px}
  .corner.tl{left:-16px;top:-16px;border-right:0;border-bottom:0}
  .corner.br{right:-16px;bottom:-16px;border-left:0;border-top:0}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  .lead{margin:0;max-width:22em;text-align:center;font-size:16px;line-height:1.75;color:#E6E3F0}
  .btn{appearance:none;border:0;font:inherit;font-weight:700;cursor:pointer}
  .start{background:var(--paper);color:var(--ink);font-size:18px;padding:16px 40px;border-radius:999px;
    box-shadow:0 6px 0 var(--sakura);transition:transform .12s, box-shadow .12s}
  .start:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sakura)}
  .btn:focus-visible{outline:3px solid var(--sakura);outline-offset:3px}
  .note{font-size:13px;color:#A9A4BC;text-align:center;max-width:24em;line-height:1.6;margin:0}
  .note.warn{color:#FFB3CB}

  /* ---------- live UI ---------- */
  #status{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);
    background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:9px 18px;border-radius:999px;font-size:14px;white-space:nowrap;max-width:calc(100vw - 32px);
    overflow:hidden;text-overflow:ellipsis;transition:opacity .4s;pointer-events:none}
  #status.off{opacity:0}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:28px;
    padding:12px 20px calc(18px + env(safe-area-inset-bottom));transition:opacity .35s}
  #bar.dim{opacity:.28}
  #bar.hidden,#status.hidden{display:none}
  .round{width:52px;height:52px;border-radius:50%;background:var(--glass);color:var(--paper);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center}
  .round svg{width:24px;height:24px}
  #rec{width:74px;height:74px;border-radius:50%;background:transparent;border:4px solid var(--paper);display:grid;place-items:center}
  #rec span{display:block;width:54px;height:54px;border-radius:50%;background:var(--rec);transition:all .2s}
  #rec.on span{width:28px;height:28px;border-radius:7px}
  #timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));
    background:var(--rec);padding:4px 12px;border-radius:6px;font-size:14px;font-variant-numeric:tabular-nums;display:none}
  #timer.on{display:block}

  /* ---------- sheets ---------- */
  .panel{position:fixed;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);
    border-radius:22px 22px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:520px;margin:0 auto;
    box-shadow:0 -10px 40px rgba(0,0,0,.35)}
  .panel.open{transform:none}
  .panel h2{margin:0 0 16px;font-family:var(--title-font);font-weight:400;font-size:20px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid #ECEAF2}
  .row label{font-size:15px;font-weight:700}
  .seg{display:flex;background:#EFEDF5;border-radius:999px;padding:3px}
  .seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:#5F5A72;
    padding:8px 14px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  input[type=range]{width:46%;accent-color:var(--sakura)}
  input[type=checkbox]{width:22px;height:22px;accent-color:var(--sakura)}
  .ghost{background:#EFEDF5;color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px}
  .close{display:block;width:100%;margin-top:14px;background:var(--ink);color:var(--paper);padding:14px;border-radius:14px;font-size:16px}
  #preview video{position:static;width:100%;height:auto;max-height:52vh;opacity:1;pointer-events:auto;border-radius:12px;background:#000}
  .pair{display:flex;gap:10px;margin-top:14px}
  .pair a,.pair button{flex:1;text-align:center;text-decoration:none;padding:14px;border-radius:14px;font-size:16px;font-weight:700}
  .pair a{background:var(--sakura);color:var(--ink)}
  .pair button{background:#EFEDF5;color:var(--ink)}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="stage"></canvas>

<section id="intro">
  <div class="window" aria-hidden="true">
    <div class="sheet"><h1>ゆびまど</h1></div>
    <div class="corner tl"></div><div class="corner br"></div>
  </div>
  <p class="lead">両手の親指と人差し指でL字の枠をつくると、その中だけアニメの世界になります。</p>
  <button class="btn start" id="startBtn">カメラをはじめる</button>
  <p class="note warn" id="introNote">ボタンが反応しない場合、この画面ではプログラムが動いていません。ファイルのプレビューではなく、https:// のURLをSafariで開いてください。</p>
</section>

<div id="status" class="hidden off"></div>
<div id="timer">00:00</div>

<nav id="bar" class="hidden">
  <button class="btn round" id="flipBtn" aria-label="カメラを切り替える">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><path d="M9.5 13.5a3 3 0 0 0 5 1.2M14.5 11.5a3 3 0 0 0-5-1.2"/><path d="M14.5 14.7V13h-1.7M9.5 10.3V12h1.7"/></svg>
  </button>
  <button class="btn" id="rec" aria-label="録画を開始"><span></span></button>
  <button class="btn round" id="setBtn" aria-label="設定をひらく">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</nav>

<section class="panel" id="settings" aria-label="設定">
  <h2>まどの中身</h2>
  <div class="row"><label>スタイル</label>
    <div class="seg" id="modeSeg">
      <button data-mode="0" aria-pressed="true">アニメ</button>
      <button data-mode="1" aria-pressed="false">漫画</button>
      <button data-mode="2" aria-pressed="false">画像</button>
    </div>
  </div>
  <div class="row"><label for="edge">線の強さ</label><input id="edge" type="range" min="0" max="2" step="0.05" value="1"></div>
  <div class="row"><label for="levels">色の段数</label><input id="levels" type="range" min="2" max="8" step="1" value="4"></div>
  <div class="row"><label>画像</label><button class="btn ghost" id="pickBtn">画像を選ぶ</button>
    <input type="file" id="file" accept="image/*" hidden></div>
  <div class="row"><label for="debug">デバッグ表示</label><input type="checkbox" id="debug"></div>
  <button class="btn close" id="closeSet">閉じる</button>
</section>

<section class="panel" id="preview" aria-label="録画のプレビュー">
  <h2>録画できました</h2>
  <video id="pv" controls playsinline></video>
  <div class="pair"><a id="saveLink" download="yubimado.mp4">保存する</a><button class="btn" id="closePv">閉じる</button></div>
</section>

<script type="module">
/* =========================================================
   ゆびまど — finger-window AR effect
   Camera → HandLandmarker → One Euro → 4-point polygon
   → clip → toon (WebGL) layer → paper edge → canvas → recorder
   ========================================================= */
const MP_VER = "0.10.14";
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL  = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const GRACE_MS = 260;          // keep the window open briefly when tracking drops

const $ = id => document.getElementById(id);
const video = $("cam"), canvas = $("stage"), ctx = canvas.getContext("2d");
const statusEl = $("status");

const S = {
  facing: "user", stream: null, W: 0, H: 0, dpr: 1,
  mode: 0, edge: 1, levels: 4, debug: false, userImg: null,
  hands: null, handsReady: false, lastVideoTime: -1,
  corners: null, raw: null, landmarks: [], lastSeen: 0, visible: false, open: 0,
  fps: 0, detMs: 0, detFps: 0, nHands: 0,
  pointers: new Map(), dragStart: null,
};

const inFrame = (()=>{ try { return window.self !== window.top; } catch { return true; } })();
function envProblem(){
  if (!window.isSecureContext) return "このページは https:// か localhost で開く必要があります（ファイルを直接開くとカメラが使えません）。";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return inFrame
      ? "プレビュー画面の中ではカメラが使えません。ファイルをHTTPSで公開し、SafariかChromeで直接開いてください。"
      : "このブラウザではカメラが使えません。SafariかChromeで開いてください。";
  return null;
}
const envMsg = envProblem();
$("introNote").classList.remove("warn");
$("introNote").textContent = "カメラ映像は端末の中だけで処理され、どこにも送信されません。";
if (envMsg){ $("introNote").textContent = envMsg; $("introNote").classList.add("warn"); }

/* show any runtime error on screen so it can be reported */
function showError(msg){
  console.error(msg);
  const intro = !$("intro").classList.contains("hidden");
  if (intro){ const n = $("introNote"); n.classList.add("warn"); n.textContent = "エラー: " + msg; }
  else say("エラー: " + msg, 8000);
}
addEventListener("error", e => showError(e.message || String(e.error)));
addEventListener("unhandledrejection", e => showError((e.reason && (e.reason.message || e.reason.name)) || String(e.reason)));

/* ---------- status pill ---------- */
let statusTimer;
function say(msg, ms = 0){
  statusEl.textContent = msg; statusEl.classList.remove("hidden","off");
  clearTimeout(statusTimer);
  if (ms) statusTimer = setTimeout(()=>statusEl.classList.add("off"), ms);
}

/* ---------- sizing ---------- */
function resize(){
  S.dpr = Math.min(window.devicePixelRatio || 1, 2);
  S.W = innerWidth; S.H = innerHeight;
  canvas.width = Math.round(S.W*S.dpr); canvas.height = Math.round(S.H*S.dpr);
}
addEventListener("resize", resize); resize();

/* video → screen (object-fit: cover, mirrored for selfie) */
function cover(){
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(S.W/vw, S.H/vh), dw = vw*s, dh = vh*s;
  return { dw, dh, ox:(S.W-dw)/2, oy:(S.H-dh)/2, mirror: S.facing === "user" };
}
function toScreen(lm, c){
  const nx = c.mirror ? 1 - lm.x : lm.x;
  return { x: c.ox + nx*c.dw, y: c.oy + lm.y*c.dh };
}

/* ---------- camera ---------- */
async function startCamera(){
  if (S.stream) S.stream.getTracks().forEach(t=>t.stop());
  try{
    S.stream = await navigator.mediaDevices.getUserMedia({
      audio:false, video:{ facingMode:S.facing, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60} }
    });
  }catch(e){
    if (e.name === "NotAllowedError" || e.name === "SecurityError") throw e;
    S.stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:S.facing } });
  }
  video.srcObject = S.stream;
  await video.play();
  S.lastVideoTime = -1;
}

/* ---------- hand tracking ---------- */
async function loadHands(){
  say("手の認識を準備しています…");
  try{
    const { FilesetResolver, HandLandmarker } = await import(`${MP_URL}/vision_bundle.mjs`);
    const fs = await FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
    const opts = (delegate)=>({ baseOptions:{ modelAssetPath:MODEL, delegate }, runningMode:"VIDEO", numHands:2,
      minHandDetectionConfidence:.5, minHandPresenceConfidence:.5, minTrackingConfidence:.5 });
    try { S.hands = await HandLandmarker.createFromOptions(fs, opts("GPU")); }
    catch { S.hands = await HandLandmarker.createFromOptions(fs, opts("CPU")); }
    S.handsReady = true;
    say("両手でL字の枠をつくってみてください", 4500);
  }catch(e){
    console.error(e);
    say("手の認識を読み込めませんでした。画面を指でドラッグすると窓をひらけます", 7000);
  }
}

/* One Euro filter */
class OneEuro{
  constructor(minCutoff=1.1, beta=0.009, dCutoff=1){ Object.assign(this,{minCutoff,beta,dCutoff}); this.reset(); }
  reset(){ this.x=null; this.dx=0; this.t=null; }
  a(cut, dt){ const tau = 1/(2*Math.PI*cut); return 1/(1+tau/dt); }
  f(x, t){
    if (this.x === null){ this.x=x; this.t=t; return x; }
    const dt = Math.max((t-this.t)/1000, 1e-3); this.t = t;
    const dx = (x-this.x)/dt;
    this.dx += this.a(this.dCutoff, dt)*(dx-this.dx);
    const cut = this.minCutoff + this.beta*Math.abs(this.dx);
    this.x += this.a(cut, dt)*(x-this.x);
    return this.x;
  }
}
const filters = Array.from({length:8}, ()=>new OneEuro());

function detect(now){
  if (!S.handsReady || video.readyState < 2 || video.currentTime === S.lastVideoTime) return;
  S.lastVideoTime = video.currentTime;
  const t0 = performance.now();
  const res = S.hands.detectForVideo(video, t0);
  const dt = performance.now() - t0;
  S.detMs += (dt - S.detMs)*.1;
  S.detFps += (1000/Math.max(now - (S._lastDet||now-33), 1) - S.detFps)*.1; S._lastDet = now;

  const c = cover();
  const hands = (res.landmarks || []).map(l => l.map(p => toScreen(p, c)));
  S.landmarks = hands; S.nHands = hands.length;
  if (hands.length >= 2){
    hands.sort((a,b)=>a[0].x - b[0].x);           // screen-left hand first (robust vs. handedness labels)
    const [L, R] = hands;
    // corner order is tied to finger identity, so twisting the hands makes the bow-tie seen in the video
    const raw = [L[8], R[8], R[4], L[4]];
    if (!S.visible) filters.forEach(f=>f.reset());
    S.raw = raw;
    S.corners = raw.map((p,i)=>({ x: filters[i*2].f(p.x, now), y: filters[i*2+1].f(p.y, now) }));
    S.lastSeen = now; S.visible = true;
  }
}

/* ---------- pointer fallback (mouse / touch) ---------- */
canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  S.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (S.pointers.size === 1) S.dragStart = {x:e.clientX, y:e.clientY};
});
canvas.addEventListener("pointermove", e=>{ if (S.pointers.has(e.pointerId)) S.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY}); });
const lift = e=>{ S.pointers.delete(e.pointerId); if (!S.pointers.size) S.dragStart = null; };
canvas.addEventListener("pointerup", lift); canvas.addEventListener("pointercancel", lift);

function pointerCorners(){
  if (!S.pointers.size) return null;
  const pts = [...S.pointers.values()];
  const a = pts.length >= 2 ? pts[0] : S.dragStart, b = pts.length >= 2 ? pts[1] : pts[0];
  if (!a || Math.hypot(a.x-b.x, a.y-b.y) < 12) return null;
  return [{x:a.x,y:a.y},{x:b.x,y:a.y},{x:b.x,y:b.y},{x:a.x,y:b.y}];
}

/* ---------- toon layer (WebGL) ---------- */
const glc = document.createElement("canvas");
const gl = glc.getContext("webgl", { preserveDrawingBuffer:true, premultipliedAlpha:false, antialias:false });
let prog, uni = {}, tex;
const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;
const FS = `
precision highp float;
varying vec2 v;
uniform sampler2D t; uniform vec2 px; uniform float levels, edgeK; uniform int mode;
float lum(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
float L(vec2 o){ return lum(texture2D(t, v + o*px).rgb); }
void main(){
  vec3 c0 = texture2D(t, v).rgb;
  vec3 acc = vec3(0.); float ws = 0.;
  for (int y=-2; y<=2; y++) for (int x=-2; x<=2; x++){
    vec2 o = vec2(float(x), float(y));
    vec3 c = texture2D(t, v + o*px*1.6).rgb;
    float d = distance(c, c0);
    float w = exp(-d*d*38.) * exp(-dot(o,o)*.18);
    acc += c*w; ws += w;
  }
  vec3 s = acc/ws;
  float gx = -L(vec2(-1,1)) - 2.*L(vec2(-1,0)) - L(vec2(-1,-1)) + L(vec2(1,1)) + 2.*L(vec2(1,0)) + L(vec2(1,-1));
  float gy = -L(vec2(-1,-1)) - 2.*L(vec2(0,-1)) - L(vec2(1,-1)) + L(vec2(-1,1)) + 2.*L(vec2(0,1)) + L(vec2(1,1));
  float edge = smoothstep(.16, .42, length(vec2(gx,gy)) * edgeK);
  float l = lum(s);
  float k = l*levels;
  float q = (floor(k) + smoothstep(.42,.58,fract(k)))/levels;
  q = max(q, .08);
  if (mode == 1){
    // manga: white paper, ink lines, halftone shadows
    vec2 g = mod(gl_FragCoord.xy, 6.) - 3.;
    float dotR = (1. - q) * 3.4;
    float tone = step(length(g), dotR);
    float ink = q < .2 ? 1. : tone * step(q, .75);
    vec3 col = mix(vec3(1.), vec3(.09,.08,.12), max(ink*.9, edge));
    gl_FragColor = vec4(col, 1.);
    return;
  }
  vec3 col = s * (q / max(l, .001));
  col = mix(vec3(lum(col)), col, 1.35);          // saturation
  col = pow(clamp(col,0.,1.), vec3(.82));        // lift, airy anime light
  col = mix(col, col*vec3(1.04,.99,1.02), .6);   // slight rosy cast
  col = mix(col, vec3(.16,.11,.14), edge*.88);
  gl_FragColor = vec4(col, 1.);
}`;
function initGL(){
  if (!gl) return;
  const sh = (type, src)=>{ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  ["t","px","levels","edgeK","mode"].forEach(n => uni[n] = gl.getUniformLocation(prog, n));
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
}
initGL();
function renderToon(){
  if (!gl || video.readyState < 2) return false;
  const vw = video.videoWidth, vh = video.videoHeight, sc = Math.min(1, 960/Math.max(vw,vh));
  const w = Math.round(vw*sc), h = Math.round(vh*sc);
  if (glc.width !== w || glc.height !== h){ glc.width = w; glc.height = h; }
  gl.viewport(0,0,w,h);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
  gl.uniform1i(uni.t, 0); gl.uniform2f(uni.px, 1/w, 1/h);
  gl.uniform1f(uni.levels, S.levels); gl.uniform1f(uni.edgeK, S.edge); gl.uniform1i(uni.mode, S.mode);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  return true;
}

/* ---------- drawing ---------- */
function drawVideoLike(src, c){
  ctx.save();
  if (c.mirror){ ctx.translate(S.W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, c.ox, c.oy, c.dw, c.dh);
  ctx.restore();
}
function drawImageCover(img){
  const s = Math.max(S.W/img.width, S.H/img.height), w = img.width*s, h = img.height*s;
  ctx.drawImage(img, (S.W-w)/2, (S.H-h)/2, w, h);
}
function path(P){ ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y); for (let i=1;i<P.length;i++) ctx.lineTo(P[i].x,P[i].y); ctx.closePath(); }
const ease = t => 1 - Math.pow(1-t, 3);

function drawWindow(P, open, c){
  const cx = P.reduce((a,p)=>a+p.x,0)/4, cy = P.reduce((a,p)=>a+p.y,0)/4, k = ease(open);
  const Q = P.map(p=>({ x: cx + (p.x-cx)*k, y: cy + (p.y-cy)*k }));
  // shadow + paper under-layer
  ctx.save(); path(Q);
  ctx.shadowColor = "rgba(0,0,0,.32)"; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  ctx.fillStyle = "#fff"; ctx.globalAlpha = Math.min(1, open*1.4); ctx.fill(); ctx.restore();
  // content
  ctx.save(); path(Q); ctx.clip();
  if (S.mode === 2 && S.userImg) drawImageCover(S.userImg);
  else if (renderToon()) drawVideoLike(glc, c);
  // paper sheen
  const g = ctx.createLinearGradient(Q[0].x, Q[0].y, Q[2].x, Q[2].y);
  g.addColorStop(0, "rgba(255,255,255,.14)"); g.addColorStop(.5, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(0,0,0,.06)");
  ctx.fillStyle = g; ctx.fillRect(0,0,S.W,S.H);
  ctx.restore();
  // white edge
  ctx.save(); path(Q); ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,255,255,.92)"; ctx.stroke(); ctx.restore();
}

function drawDebug(P){
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,.55)";
  for (const h of S.landmarks) for (const p of h){ ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill(); }
  if (P){
    const names = ["L人差し指","R人差し指","R親指","L親指"];
    ctx.strokeStyle = "#FF6FA3"; ctx.lineWidth = 1.5; ctx.setLineDash([6,5]); path(P); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = "12px sans-serif";
    P.forEach((p,i)=>{ ctx.fillStyle = "#FF6FA3"; ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillText(names[i], p.x+9, p.y-9); });
    if (S.raw) { ctx.fillStyle = "#7CF"; S.raw.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); }); }
  }
  const lines = [
    `描画 ${S.fps.toFixed(0)} fps`, `認識 ${S.detFps.toFixed(0)} fps / ${S.detMs.toFixed(1)} ms`,
    `検出した手 ${S.nHands}`, `窓 ${S.visible ? "表示" : "非表示"}  open ${S.open.toFixed(2)}`,
    `映像 ${video.videoWidth}×${video.videoHeight}`,
  ];
  const top = 60 + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sat")) || 0);
  ctx.fillStyle = "rgba(22,19,31,.6)"; ctx.fillRect(10, top, 210, lines.length*18+12);
  ctx.fillStyle = "#fff"; ctx.font = "13px sans-serif";
  lines.forEach((l,i)=>ctx.fillText(l, 18, top+20+i*18));
  ctx.restore();
}

/* ---------- main loop ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, .1); last = now;
  S.fps += (1/Math.max(dt,1e-3) - S.fps)*.08;

  try { detect(now); }
  catch(e){ S.handsReady = false; showError("手の認識が停止しました（" + (e.message||e) + "）。指でドラッグすると窓をひらけます"); }
  if (S.visible && now - S.lastSeen > GRACE_MS) S.visible = false;

  const manual = pointerCorners();
  const P = manual || S.corners;
  const target = (manual || S.visible) ? 1 : 0;
  S.open += (target - S.open) * (1 - Math.exp(-dt * (target ? 14 : 9)));
  if (S.open < .002) S.open = 0;

  ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  ctx.fillStyle = "#16131F"; ctx.fillRect(0,0,S.W,S.H);
  const c = cover();
  if (video.readyState >= 2) drawVideoLike(video, c);
  try {
    if (P && S.open > 0) drawWindow(P, S.open, c);
    if (S.debug) drawDebug(P);
  } catch(e){ if (!S._drawErr){ S._drawErr = true; showError("描画エラー: " + (e.message||e)); } }

  $("bar").classList.toggle("dim", S.open > .5);
  requestAnimationFrame(loop);
}

/* ---------- recording ---------- */
let rec = null, chunks = [], recStart = 0, recTick;
function pickMime(){
  const list = ["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
  return list.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
function toggleRec(){
  const btn = $("rec");
  if (rec && rec.state === "recording"){ rec.stop(); return; }
  if (!window.MediaRecorder || !canvas.captureStream){ say("このブラウザは録画に対応していません", 3500); return; }
  const mime = pickMime();
  rec = new MediaRecorder(canvas.captureStream(30), mime ? { mimeType:mime, videoBitsPerSecond:6e6 } : undefined);
  chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = ()=>{
    clearInterval(recTick); $("timer").classList.remove("on");
    btn.classList.remove("on"); btn.setAttribute("aria-label","録画を開始");
    const type = rec.mimeType || mime || "video/webm";
    const blob = new Blob(chunks, { type });
    const url = URL.createObjectURL(blob);
    $("pv").src = url; $("saveLink").href = url;
    $("saveLink").download = "yubimado." + (type.includes("mp4") ? "mp4" : "webm");
    $("preview").classList.add("open");
  };
  rec.start(250); recStart = performance.now();
  btn.classList.add("on"); btn.setAttribute("aria-label","録画を停止");
  $("timer").classList.add("on"); $("timer").textContent = "00:00";
  recTick = setInterval(()=>{ const s = Math.floor((performance.now()-recStart)/1000);
    $("timer").textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }, 250);
}

/* ---------- UI wiring ---------- */
$("startBtn").addEventListener("click", async ()=>{
  $("startBtn").disabled = true; $("startBtn").textContent = "起動しています…";
  try{
    await startCamera();
    $("intro").classList.add("hidden"); $("bar").classList.remove("hidden");
    requestAnimationFrame(loop);
    loadHands();
  }catch(e){
    console.error(e);
    $("startBtn").disabled = false; $("startBtn").textContent = "もう一度試す";
    const n = $("introNote"); n.classList.add("warn");
    n.textContent = envProblem()
      || (e.name === "NotAllowedError"
        ? (inFrame ? "プレビュー画面の中ではカメラが許可されません。HTTPSのURLをSafariかChromeで直接開いてください。"
                   : "カメラの使用が許可されていません。ブラウザの設定でこのページにカメラを許可してください。")
        : e.name === "NotReadableError"
        ? "カメラが他のアプリで使われています。ほかのアプリを閉じてからもう一度試してください。"
        : "カメラを起動できませんでした（" + (e.name || e.message || e) + "）。");
  }
});
$("flipBtn").addEventListener("click", async ()=>{
  S.facing = S.facing === "user" ? "environment" : "user";
  try { await startCamera(); filters.forEach(f=>f.reset()); S.visible = false; }
  catch { S.facing = S.facing === "user" ? "environment" : "user"; say("カメラを切り替えられませんでした", 3000); await startCamera(); }
});
$("rec").addEventListener("click", toggleRec);
$("setBtn").addEventListener("click", ()=>$("settings").classList.add("open"));
$("closeSet").addEventListener("click", ()=>$("settings").classList.remove("open"));
$("closePv").addEventListener("click", ()=>{ $("preview").classList.remove("open"); $("pv").pause(); });

function setMode(m){
  if (m === 2 && !S.userImg){ $("file").click(); return; }
  S.mode = m;
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.mode === m)));
}
$("modeSeg").addEventListener("click", e=>{ const b = e.target.closest("button"); if (b) setMode(+b.dataset.mode); });
$("edge").addEventListener("input", e=>S.edge = +e.target.value);
$("levels").addEventListener("input", e=>S.levels = +e.target.value);
$("debug").addEventListener("change", e=>S.debug = e.target.checked);
$("pickBtn").addEventListener("click", ()=>$("file").click());
$("file").addEventListener("change", e=>{
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = ()=>{ S.userImg = img; setMode(2); };
  img.src = URL.createObjectURL(f);
});

// block pinch-zoom / double-tap zoom on iOS
document.addEventListener("gesturestart", e=>e.preventDefault());
let lastTouch = 0;
document.addEventListener("touchend", e=>{ const n = Date.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n; }, { passive:false });
</script>
</body>
